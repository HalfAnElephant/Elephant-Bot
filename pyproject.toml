[project]
name = "elephant-qqbot"
version = "0.1.0"
description = "Personal QQ Leader and Workers with durable tasks and controlled tools"
requires-python = "==3.13.*"
license = "AGPL-3.0-only"
dependencies = ["pydantic>=2.12,<3", "PyYAML>=6,<7", "fastapi>=0.121,<1", "uvicorn[standard]>=0.38,<1", "httpx>=0.28,<1", "anyio>=4,<5", "cryptography>=46,<49", "sqlalchemy>=2.0,<3", "alembic>=1.17,<2", "icalendar>=6,<7", "qrcode>=8,<9", "websockets>=17,<18"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]
[project.scripts]
qqbot = "qqbot.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/qqbot"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
