name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:
    secrets:
      DEEPSEEK_API_KEY:
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: 'true'

jobs:
  correctness:
    name: Correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.8'
          enable-cache: true
      - run: uv sync --python "$(cat .python-version)"
      - run: npm ci --ignore-scripts
      - name: Install audio decoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Record environment and require Pi fixtures
        run: |
          mkdir -p test-results
          {
            git rev-parse HEAD
            uname -a
            uv run python --version
            node --version
            test -x node_modules/.bin/pi
            node_modules/.bin/pi --version
          } | tee test-results/environment.log
      - name: Python regression
        run: |
          uv run pytest -q --junitxml=test-results/pytest.xml 2>&1 | tee test-results/pytest.log
          uv run python -c 'import xml.etree.ElementTree as ET; assert not ET.parse("test-results/pytest.xml").findall(".//skipped"), "CI requires all fixtures to run"'
      - name: Console regression
        if: ${{ !cancelled() }}
        run: node --test tests/console_ui.test.cjs 2>&1 | tee test-results/console.log
      - name: Lint
        if: ${{ !cancelled() }}
        run: uv run ruff check src tests evals scripts 2>&1 | tee test-results/ruff.log
      - name: Configuration schema
        if: ${{ !cancelled() }}
        run: |
          uv run elephant schema > "$RUNNER_TEMP/schema.json"
          uv run python -c 'import json, os; from pathlib import Path; assert json.loads(Path("configs/schema.json").read_text()) == json.loads((Path(os.environ["RUNNER_TEMP"]) / "schema.json").read_text()), "Regenerate configs/schema.json with elephant schema"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: correctness-results
          path: test-results/
          retention-days: 14

  build:
    name: Build and smoke test
    needs: correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.8'
          enable-cache: true
      - name: Build distributions and complete source bundle
        run: |
          uv python install "$(cat .python-version)"
          uv build --no-sources
          git archive --format=tar.gz --prefix=elephant-bot/ --output=dist/elephant-bot.tar.gz HEAD
          git rev-parse HEAD > dist/REVISION
      - name: Install local audio dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install and check the extracted release
        run: |
          mkdir "$RUNNER_TEMP/release"
          tar -xzf dist/elephant-bot.tar.gz -C "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release/elephant-bot"
          ./install.sh --dry-run
          ./install.sh --apply --install-pi
          uv pip install --python .venv/bin/python --no-deps --reinstall "$GITHUB_WORKSPACE"/dist/*.whl
          .venv/bin/python -c 'import subprocess; from elephant.pi_installation import runtime_pi_path; subprocess.check_call([runtime_pi_path("node_modules/.bin/pi"), "--version"])'
          ./elephant validate
          .venv/bin/elephant doctor
          .venv/bin/elephant doctor --share-safe
          .venv/bin/python scripts/smoke_release.py
          .venv/bin/python scripts/smoke_guided_install.py
      - name: Checksum release assets
        working-directory: dist
        run: sha256sum ./*.whl ./*.tar.gz REVISION > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload-release-assets
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download-release-assets
        continue-on-error: true
        with:
          artifact-ids: ${{ steps.upload-release-assets.outputs.artifact-id }}
          path: ${{ runner.temp }}/downloaded-release
      # Artifact listings can briefly lag behind a successful upload.
      - name: Wait before retrying artifact download
        if: steps.download-release-assets.outcome == 'failure'
        run: sleep 5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.download-release-assets.outcome == 'failure'
        with:
          artifact-ids: ${{ steps.upload-release-assets.outputs.artifact-id }}
          path: ${{ runner.temp }}/downloaded-release
      - name: Verify uploaded release assets
        working-directory: ${{ runner.temp }}/downloaded-release
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          sha256sum --check SHA256SUMS
          test "$(cat REVISION)" = "$EXPECTED_SHA"

  install-macos:
    name: macOS installation (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: Apple Silicon
          - runner: macos-15-intel
            arch: Intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.19.0'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.8'
      - name: Install from a clean source bundle
        run: |
          git archive --format=tar --prefix=elephant-bot/ HEAD | tar -xf - -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/elephant-bot"
          ./install.sh --dry-run
          if command -v pi >/dev/null 2>&1; then
            echo "Unexpected preinstalled Pi on a clean-install test runner" >&2
            exit 1
          fi
          if ./install.sh --apply > "$RUNNER_TEMP/pi-declined.log" 2>&1; then
            echo "Installer installed Pi without approval" >&2
            exit 1
          fi
          grep -F '未安装 Pi' "$RUNNER_TEMP/pi-declined.log"
          for output in .elephant-pi node_modules .venv; do
            test ! -e "$output"
            test ! -L "$output"
          done
          ./install.sh --apply --install-pi
          test "$(cat .elephant-pi)" = bundled
          .venv/bin/python -c 'import subprocess; from elephant.pi_installation import runtime_pi_path; subprocess.check_call([runtime_pi_path("node_modules/.bin/pi"), "--version"])'
          ./elephant doctor --share-safe
          .venv/bin/python -c 'from pilk_nogil import decode'
          .venv/bin/python scripts/smoke_release.py
          .venv/bin/python scripts/smoke_guided_install.py
      - name: Reuse an existing compatible Pi without installing a second copy
        run: |
          git archive --format=tar --prefix=elephant-reuse/ HEAD | tar -xf - -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/elephant-bot/node_modules/.bin:$PATH"
          cd "$RUNNER_TEMP/elephant-reuse"
          ./install.sh --apply
          test ! -e node_modules
          test ! -L node_modules
          .venv/bin/python -c 'import pathlib, shutil; from elephant.pi_installation import runtime_pi_path; assert pathlib.Path(runtime_pi_path("node_modules/.bin/pi")).resolve() == pathlib.Path(shutil.which("pi")).resolve()'
          .venv/bin/python scripts/smoke_guided_install.py

  dialogue:
    name: DeepSeek dialogue
    needs: correctness
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.8'
          enable-cache: true
      - run: uv sync --python "$(cat .python-version)"
      - run: npm ci --ignore-scripts
      - name: Exercise conversations with the official DeepSeek API
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: uv run python evals/dialogue_live.py
      - name: Exercise DeepSeek web, files and voice APIs
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: uv run python evals/deepseek_tools_live.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: dialogue-live-results
          path: |
            test-results/dialogue-live.json
            test-results/deepseek-tools-live.json
          if-no-files-found: error
          retention-days: 14
