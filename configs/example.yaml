deployment_id: elephant-local
database: var/core.db
adapters: []
source_url: ''
tasks_enabled: true
interactive_execution_enabled: true
permissions:
  preset: allow_all
  default_effect: allow
  rules: []
execution:
  leader_environment: host
  worker_environment: sandbox
  foreground_wait_ms: 5000
  warm_max: 4
  warm_idle_max: 2
  warm_ttl_seconds: 300
context:
  max_request_bytes: 16777216
  max_tokens: null # pi automatic threshold, derived from the model window
  keep_recent_tokens: null # pi automatic recent-context retention
  compaction_output_tokens: 4096
model:
  endpoint: null
  model: null
  api_key_env: ELEPHANT_MODEL_KEY
  context_window: 32768 # Set the actual window supported by your model.
# Add QQ through /admin/qq-onboarding after setting ELEPHANT_CREDENTIAL_KEY.

owner:
  preferences: '' # Explicit name, language, or communication preferences; leave empty for no extra preference.

# Optional trusted OpenViking service. No remote calls until endpoint is configured.
memory:
  openviking:
    endpoint: null
    api_key_env: ELEPHANT_OPENVIKING_KEY
    private_enabled: true
    group_enabled: false
    bindings: []
    # Enabling memory requires an ordinary USER created in OpenViking. See docs/openviking.md.
    # bindings:
    #   - owner_id: personal-owner # Must match owner.id (the default is personal-owner).
    #     workspace_id: personal
    #     account_id: elephant
    #     user_id: assistant
    #     api_key_env: ELEPHANT_OPENVIKING_KEY
