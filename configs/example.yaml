deployment_id: elephant-local
database: var/core.db
adapters: []
source_url: ''
tasks_enabled: false
interactive_execution_enabled: true
permissions:
  preset: allow_all
  default_effect: allow
  rules: []
execution:
  leader_environment: host
  worker_environment: sandbox
  max_active: 8
  foreground_wait_ms: 5000
  warm_max: 4
  warm_idle_max: 2
  warm_ttl_seconds: 300
context:
  max_request_bytes: 16777216
  max_tokens: null # pi automatic threshold, derived from the model window
  keep_recent_tokens: null # pi automatic recent-context retention
  compaction_output_tokens: 4096
model:
  endpoint: null
  model: null
  api_key_env: QQBOT_MODEL_KEY
  context_window: 1000000 # Set the actual window supported by your model
# Set QQ official credentials before adding an adapter. Configure restrictions through permissions.
# - instance_id: official_test
#   kind: official
#   bot_id: bot_identity
#   app_id: app_id
#   secret_env: QQBOT_OFFICIAL_SECRET
#   full_mode_enabled: false
#   full_mode_verified: false

owner:
  preferences: '' # Explicit name, language, or communication preferences; leave empty for no extra preference.

# Optional trusted OpenViking service. No remote calls until endpoint is configured.
memory:
  openviking:
    endpoint: null
    api_key_env: QQBOT_OPENVIKING_KEY
    private_enabled: true
    group_enabled: false
